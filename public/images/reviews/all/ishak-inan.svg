<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A033C" />
      <stop offset="100%" stop-color="#1A1B4B" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5A65D" />
      <stop offset="100%" stop-color="#D49045" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F58655" />
      <stop offset="100%" stop-color="#E06D3B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="80" cy="80" r="80" fill="url(#bgGrad)" />

  <!-- Body / Shirt -->
  <path d="M30,160 C30,125 50,118 80,118 C110,118 130,125 130,160 Z" fill="url(#shirtGrad)" />
  
  <!-- Collar Accent -->
  <path d="M68,118 L80,132 L92,118 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Neck -->
  <rect x="70" y="96" width="20" height="26" rx="6" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="80" cy="74" rx="28" ry="32" fill="url(#skinGrad)" filter="url(#shadow)" />

  <!-- Hair -->
  <path d="M52,70 C52,42 62,36 80,36 C98,36 108,42 108,70 C104,50 98,46 80,46 C62,46 56,50 52,70 Z" fill="#152129" />

  <!-- Glasses Frame -->
  <rect x="58" y="66" width="18" height="14" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <rect x="84" y="66" width="18" height="14" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="76" y1="73" x2="84" y2="73" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Eyes behind glasses -->
  <circle cx="67" cy="73" r="2.5" fill="#152129" />
  <circle cx="93" cy="73" r="2.5" fill="#152129" />

  <!-- Warm Smile -->
  <path d="M72,88 Q80,96 88,88" fill="none" stroke="#663311" stroke-width="2.5" stroke-linecap="round" />
</svg>
